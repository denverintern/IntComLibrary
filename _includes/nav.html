<div class="utility-bar">
  <div class="utility-left">
    <span class="utility-label">Language:</span>

      <option value="{{ relative_prefix }}index.html" {% if page.language == 'en' %}selected{% endif %}>English</option>
      <option value="{{ relative_prefix }}es/index.html" {% if page.language == 'es' %}selected{% endif %}>Español</option>
      <option value="{{ relative_prefix }}pt/index.html" {% if page.language == 'pt' %}selected{% endif %}>Português</option>
      <option value="{{ relative_prefix }}fr/index.html" {% if page.language == 'fr' %}selected{% endif %}>Français</option>
      <option value="{{ relative_prefix }}it/index.html" {% if page.language == 'it' %}selected{% endif %}>Italiano</option>

      <option value="{{ relative_prefix }}zh/index.html" {% if page.language == 'zh' %}selected{% endif %}>中文</option>
      <option value="{{ relative_prefix }}ja/index.html" {% if page.language == 'ja' %}selected{% endif %}>日本語</option>

      <option value="{{ relative_prefix }}bn/index.html" {% if page.language == 'bn' %}selected{% endif %}>বাংলা</option>

      <option value="{{ relative_prefix }}tr/index.html" {% if page.language == 'tr' %}selected{% endif %}>Türkçe</option>
      <option value="{{ relative_prefix }}pl/index.html" {% if page.language == 'pl' %}selected{% endif %}>Polski</option>
      <option value="{{ relative_prefix }}el/index.html" {% if page.language == 'el' %}selected{% endif %}>Ελληνικά</option>
    </select>
    <span class="utility-sep">·</span>
    <a href="{{ relative_prefix }}es/index.html" class="utility-quick-lang {% if page.language == 'es' %}active{% endif %}">es</a>
    <a href="{{ relative_prefix }}pt/index.html" class="utility-quick-lang {% if page.language == 'pt' %}active{% endif %}">pt</a>
    <a href="{{ relative_prefix }}it/index.html" class="utility-quick-lang {% if page.language == 'it' %}active{% endif %}">it</a>
    <a href="{{ relative_prefix }}fr/index.html" class="utility-quick-lang {% if page.language == 'fr' %}active{% endif %}">fr</a>
    <a href="{{ relative_prefix }}de/index.html" class="utility-quick-lang {% if page.language == 'de' %}active{% endif %}">de</a>
    <a href="{{ relative_prefix }}ru/index.html" class="utility-quick-lang {% if page.language == 'ru' %}active{% endif %}">ru</a>
    
    <span class="utility-divider">|</span>
    
    <span class="theme-text-control">
      <button type="button" class="theme-btn" id="theme-btn-paper" title="Switch to paper ground">Paper</button>
      <span class="theme-btn-sep">/</span>
      <button type="button" class="theme-btn" id="theme-btn-night" title="Switch to night ground">Night</button>
    </span>
  </div>

  <div class="utility-right">
    <div class="header-search-wrap">
      <label for="global-search" class="search-text-label">Search:</label>
      <input type="text" id="global-search" class="search-input-clean" placeholder="Title, author, term...">
    </div>
  </div>
</div>
