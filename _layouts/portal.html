<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Internationalist Communist Library</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <style>
    :root {
      --bg-primary: #f2eee8;
      --text-main: #2b2723;
      --accent-gold: #c99e2b;
      --border-color: #d8cec0;
      --font-serif: "New York", "Iowan Old Style", "Apple Garamond", Baskerville, "Times New Roman", "Droid Serif", Times, "Source Serif Pro", serif;
      --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen-Sans, Ubuntu, Cantarell, "Helvetica Neue", sans-serif;
    }
    
    body {
      background-color: var(--bg-primary);
      color: var(--text-main);
      font-family: var(--font-sans);
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    
    .portal-container {
      max-width: 800px;
      padding: 3rem 2rem;
      text-align: center;
      border: 1px solid var(--border-color);
      background: #faf8f5;
      box-shadow: 0 10px 30px rgba(0,0,0,0.02);
    }
    
    .portal-logo {
      width: 100px;
      height: 100px;
      margin-bottom: 2rem;
    }
    
    .portal-title {
      font-family: var(--font-serif);
      font-size: 2.2rem;
      font-weight: 400;
      margin: 0 0 0.5rem 0;
      letter-spacing: 0.02em;
    }
    
    .portal-motto {
      font-family: var(--font-serif);
      font-size: 1.1rem;
      font-style: italic;
      color: #6a6258;
      margin-bottom: 3rem;
    }
    
    .lang-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 1.5rem;
      max-width: 600px;
      margin: 0 auto;
    }
    
    .lang-card {
      display: block;
      padding: 1rem;
      border: 1px solid var(--border-color);
      text-decoration: none;
      color: var(--text-main);
      transition: all 0.2s ease;
      background: var(--bg-primary);
      font-size: 0.95rem;
    }
    
    .lang-card:hover {
      border-color: var(--accent-gold);
      background: #fff;
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(201, 158, 43, 0.1);
    }
    
    .lang-card span {
      display: block;
      color: #7b746a;
      font-size: 0.8rem;
      margin-top: 0.25rem;
    }
    
    @media (max-width: 600px) {
      .lang-grid {
        grid-template-columns: repeat(2, 1fr);
      }
      .portal-title {
        font-size: 1.8rem;
      }
    }
  </style>
</head>
<body>
  <div class="portal-container">
    {{ content }}
  </div>
</body>
</html>
