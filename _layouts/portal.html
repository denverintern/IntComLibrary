<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Internationalist Communist Library | Biblioteca Comunista Internacionalista</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <script>
  const savedTheme = localStorage.getItem('lib_theme') || 'dark';
  document.documentElement.setAttribute('data-theme', savedTheme);
</script>
<style>
  :root {
    --bg-primary: #f4efe4;
      --bg-secondary: #f4efe4;
      --bg-hover: #ece5d6;
    --text-main: #1a1714;
      --text-muted: #5c554e;
      --text-dim: #7d7265;
    --accent-gold: #8f6515;
    --border-color: #d9d0c4;
    --font-serif: 'Cinzel', Georgia, "Times New Roman", Times, serif;
    --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }
  [data-theme="dark"] {
    --bg-primary: #191512;
      --bg-secondary: #191512;
      --bg-hover: #221c17;
    --text-main: #e8e0d4;
      --text-muted: #9e9384;
      --text-dim: #6e6457;
    --accent-gold: #c99e2b;
    --border-color: #363028;
  }
  
  body {

      background-color: var(--bg-primary);
      color: var(--text-main);
      font-family: var(--font-sans);
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    
    .portal-container {
      max-width: 800px;
      padding: 3rem 2rem;
      text-align: center;
      border: 1px solid var(--border-color);
      background: var(--bg-secondary);
      box-shadow: 0 10px 30px rgba(0,0,0,0.02);
    }
    
    .portal-logo {
      width: 100px;
      height: 100px;
      margin-bottom: 2rem;
    }
    
    .portal-title {
      transition: opacity 0.5s ease;
      font-family: var(--font-serif);
      font-size: 2.2rem;
      font-weight: 400;
      margin: 0 0 0.5rem 0;
      letter-spacing: 0.02em;
    }
    
    .portal-motto {
      transition: opacity 0.5s ease;
      font-family: var(--font-serif);
      font-size: 1.1rem;
      font-style: italic;
      color: var(--text-muted);
      margin-bottom: 3rem;
    }
    
    .lang-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 1.5rem;
      max-width: 600px;
      margin: 0 auto;
    }
    
    .lang-card {
  display: block;
  padding: 1rem;
  border: 1px solid var(--border-color);
  text-decoration: none;
  color: var(--text-main);
  transition: all 0.2s ease;
  background: var(--bg-primary);
  font-size: 0.95rem;
}

.lang-card:hover {
  border-color: var(--accent-gold);
  background: var(--bg-hover);
      transform: translateY(-2px);
  box-shadow: 0 4px 12px rgba(201, 158, 43, 0.1);
}

    
    .lang-card span {
      display: block;
      color: var(--text-dim);
      font-size: 0.8rem;
      margin-top: 0.25rem;
    }
    
    @media (max-width: 600px) {
      .lang-grid {
        grid-template-columns: repeat(2, 1fr);
      }
      .portal-title {
      transition: opacity 0.5s ease;
        font-size: 1.8rem;
      }
    }
  </style>
</head>
<body>
  <div class="portal-container">
    {{ content }}
  </div>
</body>
</html>
