name: Sync from Google Drive

on:
  # Runs every 6 hours automatically
  schedule:
    - cron: "0 */6 * * *"

  # Allows manual triggers anytime from the GitHub Actions tab
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Google Dependencies
        run: |
          pip install -r requirements.txt

      - name: Run Google Drive Sync
        env:
          GDRIVE_CREDENTIALS: ${{ secrets.GDRIVE_CREDENTIALS }}
          GDRIVE_SHEET_ID: ${{ secrets.GDRIVE_SHEET_ID }}
          GDRIVE_SHEET_CSV_URL: ${{ secrets.GDRIVE_SHEET_CSV_URL }}
        run: |
          python scripts/sync_gdrive.py

            - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "Ingest new texts from Google Drive"
          branch: "ingest/gdrive-sync"
          delete-branch: true
          title: "📥 Ingest new texts from Google Drive"
          body: "Automated PR from Google Drive / Form submissions. Please review the new texts and PDFs before merging."
          labels: "content"
