name: Mark Published in Google Sheet

on:
  pull_request:
    types: [closed]

jobs:
  mark-published:
    if: github.event.pull_request.merged == true && startsWith(github.head_ref, 'ingest/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install Google Dependencies
        run: pip install -r requirements.txt
      - name: Get Changed Files
        id: changed-files
        run: |
          echo "FILES=$(git diff-tree --no-commit-id --name-only -r ${{ github.sha }} | grep '^_texts/.*\.md$' | tr '\n' ' ' || true)" >> $GITHUB_ENV
      - name: Run Mark Published
        if: env.FILES != ''
        env:
          GDRIVE_CREDENTIALS: ${{ secrets.GDRIVE_CREDENTIALS }}
          GDRIVE_SHEET_ID: ${{ secrets.GDRIVE_SHEET_ID }}
        run: |
          python scripts/mark_published.py ${{ env.FILES }}
