title: Internationalist Communist Library
description: Official shared theoretical library of the internationalist communist tradition

baseurl: "/IntComLibrary"
url: "https://denverintern.github.io"

# Single URL prefix for addressable media ({id}.pdf).
# Can be pointed at object storage or a CDN later without touching _texts/*.md.
media_base_url: "/assets/uploads"

collections:
  texts:
    output: true
    permalink: /texts/:name.html

defaults:
  - scope:
      path: ""
    values:
      layout: "default"

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - DOCUMENTATION.md
  - .gitignore
  - .nojekyll
  - scripts
